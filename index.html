  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

or:#F2F2F7;font-weight:600\">87%<\u002Fspan><\u002Fspan><span style=\"color:#8A8A9E\">BTC/USDT <span style=\"color:#F2F2F7;font-weight:600\">82%<\u002Fspan><\u002Fspan><span style=\"color:#8A8A9E\">ETH/USDT <span style=\"color:#F2F2F7;font-weight:600\">82%<\u002Fspan><\u002Fspan><span style=\"color:#8A8A9E\">XAG/USD <span style=\"color:#F2F2F7;font-weight:600\">78%<\u002Fspan><\u002Fspan><span style=\"color:#8A8A9E\">AUD/USD <span style=\"color:#F2F2F7;font-weight:600\">71%<\u002Fspan><\u002Fspan><span style=\"color:#8A8A9E\">USD/JPY <span style=\"color:#F2F2F7;font-weight:600\">64%<\u002Fspan><\u002Fspan><span style=\"color:#8A8A9E\">XPT/USD <span style=\"color:#F2F2F7;font-weight:600\">52%<\u002Fspan><\u002Fspan><span style=\"color:#8A8A9E\">NZD/USD <span style=\"color:#F2F2F7;font-weight:600\">45%<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<section style=\"max-width:840px;margin:0 auto;padding:120px 32px 0;text-align:center;display:flex;flex-direction:column;gap:22px\">\n  <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#A78BFA;letter-spacing:2px\">THE REAL PROBLEM<\u002Fspan>\n  <h2 class=\"m-h2\" style=\"margin:0;font-size:40px;font-weight:700;letter-spacing:-1.2px;line-height:1.15;text-wrap:pretty\">Your strategy knows what to look for. SixOne8 knows where to look.<\u002Fh2>\n  <p style=\"margin:0 auto;font-size:17px;line-height:1.65;color:#8A8A9E;max-width:640px;text-wrap:pretty\">Every trader has strategies that work. What burns hours every day is working out which of dozens of markets those strategies actually fit right now. SixOne8 answers that question the moment you open the app — a ranked match score for every market you follow, recalculated continuously.<\u002Fp>\n  <div class=\"m-cols\" style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:24px;text-align:left\">\n    <div style=\"background:#14141F;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:8px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:#A78BFA\">0<\u002Fspan>\n      <span style=\"font-size:15px;font-weight:600;color:#F2F2F7\">Missed entries<\u002Fspan>\n      <span style=\"font-size:13.5px;line-height:1.55;color:#8A8A9E\">The scanner never sleeps, never blinks, never steps away from the desk.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:#14141F;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:8px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:#A78BFA\">1<\u002Fspan>\n      <span style=\"font-size:15px;font-weight:600;color:#F2F2F7\">Screen to check<\u002Fspan>\n      <span style=\"font-size:13.5px;line-height:1.55;color:#8A8A9E\">Your morning chart triage, replaced by one ranked list of best matches.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:#14141F;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:8px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:#A78BFA\">24/7<\u002Fspan>\n      <span style=\"font-size:15px;font-weight:600;color:#F2F2F7\">Continuous scanning<\u002Fspan>\n      <span style=\"font-size:13.5px;line-height:1.55;color:#8A8A9E\">Forex, gold and crypto watched around the clock against your rules.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"features\" style=\"max-width:1180px;margin:0 auto;padding:130px 32px 0;display:flex;flex-direction:column;gap:110px\">\n  <div style=\"text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;margin-bottom:-40px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#6E6E82;letter-spacing:3px\">THE EVERY DAY<\u002Fspan><h2 class=\"m-h2\" style=\" 02Fspan><\u002Fdiv>\n        <div style=\"background:#1A1A26;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#F2F2F7\">EMA(20) crosses above EMA(50)<\u002Fspan><span style=\"font-size:11px;color:#34D399\">met<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#1A1A26;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#F2F2F7\">Price &gt; VWAP<\u002Fspan><span style=\"font-size:11px;color:#FBBF24\">waiting<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:6px\">\n        <sc-for list=\"{{ tfs }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <span sc-camel-on-click=\"{{ p.pick }}\" style=\"{{ p.style }}\">{{ p.t }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"m-cols\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center\">\n    <div data-plx=\"0.07\" data-eb-card=\"1\" style=\"background:#14141F;border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:4px;order:0\">\n      <div style=\"padding:0 0 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.05)\">\n        <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-size:15px;font-weight:600;color:#F2F2F7\">Trend following with RSI confirmation<\u002Fspan><span style=\"font-size:10px;font-weight:600;color:#34D399;background:rgba(52,211,153,.14);padding:2px 6px;border-radius:4px;letter-spacing:.4px\">LONG<\u002Fspan><\u002Fdiv>\n        <span style=\"font-size:12px;color:#6E6E82\">51 instruments<\u002Fspan>\n      <\u002Fdiv>\n      <div data-eb- h.min(1, v));\n        const cl = document.querySelector('[data-candles]');\n        if (cl) {\n          const sc = document.documentElement.scrollTop || window.scrollY || 0;\n          const p = clamp(sc / (vh * 0.65));\n          Array.from(cl.children).forEach((c, i) => {\n            const cp = clamp((p - (i - 2) / 18) * 10);\n            c.style.opacity = cp.toFixed(2);\n            c.style.transformOrigin = 'bottom';\n            c.style.transform = 'scaleY(' + cp.toFixed(2) + ')';\n          });\n        }\n        const bt = document.querySelector('[data-bt-card]');\n        if (bt) {\n          const r = bt.getBoundingClientRect();\n          const p = clamp((vh - r.top) / (vh * 0.7));\n          const bars = bt.querySelectorAll('[data-bt-bars] > div');\n          bars.forEach((b, i) => {\n            const bp = clamp((p - (i / bars.length) * 0.55) / 0.45);\n            b.style.transformOrigin = 'bottom';\n            b.style.transform = 'scaleY(' + bp.toFixed(3) + ')';\n          });\n          const stats = bt.querySelector('[data-bt-stats]');\n          if (stats) Array.from(stats.children).forEach((s, i) => {\n            const sp = clamp((p - 0.5 - i * 0.16) / 0.14);\n            s.style.opacity = sp.toFixed(2);\n            s.style.transform = 'translateY(' + (14 * (1 - sp)).toFixed(1) + 'px)';\n          });\n        }\n        const aic = document.querySelector('[data-ai-card]');\n        if (aic && !this._aiDone && aic.getBoundingClientRect().top < vh * 0.65) {\n          this._runAi(aic);\n        }\n        const evc = document.querySelector('[data-ev-card]');\n        if (evc && !this._evStarted && evc.getBoundingClientRect().top < vh * 0.7) {\n          this._runEv(evc);\n        }\n        const eb = document.querySelector('[data-eb-card]');\n        if (eb) {\n          const r = eb.getBoundingClientRect();\n          const q = clamp((vh * 0.9 - r.top) / (vh * 0.55));\n          const fill = clamp(q / 0.55);\n          const pct = Math.round(58 + 42 * fill);\n          const pctEl = eb.querySelector('[data-eb-pct]');\n          const barEl = eb.querySelector('[data-eb-bar]');\n          const gbp = eb.querySelector('[data-eb-row=\"gbp\"]');\n          const eur = eb.querySelector('[data-eb-row=\"eur\"]');\n          const aud = eb.querySelector('[data-eb-row=\"aud\"]');\n          if (pctEl && barEl && gbp && eur && aud) {\n            pctEl.textContent = pct + '%';\n            barEl.style.width = pct + '%';\n            const done = fill >= 1;\n            pctEl.style.color = done ? '#A78BFA' : '#F2F2F7';\n            const met = eb.querySelector('[data-eb-met]');\n            if (met) met.style.display = done ? 'block' : 'none';\n            barEl.style.background = done ? 'linear-gradient(90deg,#6D28D9,#A78BFA)' : 'linear-gradient(90deg,#4C1D95,#7C5CFF)';\n            const m = clamp((q - 0.62) / 0.33);\n            const e2 = m < 0.5 ? 2 * m * m : 1 - Math.pow(-2 * m + 2, 2) / 2;\n            const up = eur.offsetHeight + aud.offsetHeight;\n            const down = gbp.offsetHeight;\n            gbp.style.transform = 'translateY(' + (-up * e2).toFixed(1) + 'px)';\n            gbp.style.position = 'relative';\n            gbp.style.zIndex = '2';\n            gbp.style.background = 'rgba(124,92,255,' + (0.14 * e2).toFixed(3) + ')';\n            gbp.style.borderRadius = '10px';\n            gbp.style.borderTopColor = 'rgba(255,255,255,' + (0.04 * (1 - e2)).toFixed(3) + ')';\n            gbp.style.paddingLeft = (10 * e2).toFixed(1) + 'px';\n            gbp.style.paddingRight = (10 * e2).toFixed(1) + 'px';\n            gbp.style.marginLeft = (-10 * e2).toFixed(1) + 'px';\n            gbp.style.marginRight = (-10 * e2).toFixed(1) + 'px';\n            eur.style.transform = 'translateY(' + (down * e2).toFixed(1) + 'px)';\n            aud.style.transform = 'translateY(' + (down * e2).toFixed(1) + 'px)';\n          }\n        }\n      });\n    };\n    document.addEventListener('scroll', this._plx, { capture: true, passive: true });\n    window.addEventListener('resize', this._plx, { passive: true });\n    this._plx();\n  }\n  _runAi(aic) {\n    const txt = '\"Buy when the 1-hour trend is bullish. On the 1-hour chart, wait for price to break above the previous swing high and RSI showing significantly oversold\"';\n    const tEl = aic.querySelector('[data-ai-text]');\n    const btn = aic.querySelector('[data-ai-btn]');\n    const steps = Array.from(aic.querySelectorAll('[data-ai-step]'));\n    if (!tEl || !btn) return;\n    this._aiDone = true;\n    let i = 0;\n    const type = () => {\n      i += 1 + Math.floor(Math.random() * 2);\n      if (i > txt.length) i = txt.length;\n      tEl.textContent = txt.slice(0, i) + (i < txt.length ? '▌' : '');\n      if (i < txt.length) setTimeout(type, 14 + Math.random() * 22);\n      else setTimeout(press, 420);\n    };\n    const press = () => {\n      const b = btn.firstElementChild;\n      let n = 0;\n      const flash = () => {\n        b.style.background = n % 2 === 0 ? '#C4B5FD' : '#7C5CFF';\n        n++;\n        if (n < 4) setTimeout(flash, 90);\n        else setTimeout(() => { btn.style.display = 'none'; reveal(0); }, 200);\n      };\n      flash();\n    };\n    const reveal = (k) => {\n      if (k >= steps.length) return;\n      steps[k].style.opacity = '1';\n      steps[k].style.transform = 'translateY(0)';\n      setTimeout(() => reveal(k + 1), k === 3 ? 950 : 400);\n    };\n    type();\n  }\n  _runEv(c) {\n    const chips = Array.from(c.querySelectorAll('[data-ev-chip]'));\n    if (!chips.length) return;\n    this._evStarted = true;\n    const names = chips.map((ch) => ch.querySelector('[data-ev-name]'));\n    const scores = chips.map((ch) => ch.querySelector('[data-ev-score]'));\n    const fills = chips.map((ch) => ch.querySelector('[data-ev-fill]'));\n    const genEl = c.querySelector('[data-ev-gen]');\n    const status = c.querySelector('[data-ev-status]');\n    const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));\n    const pool = [\n      () => 'RSI ' + rnd(20, 40),\n      () => 'EMA ' + rnd(8, 21) + '/' + rnd(24, 55),\n      () => 'MACD ' + rnd(8, 13) + '/' + rnd(21, 34),\n      () => 'BB(' + rnd(14, 22) + ',2)',\n      () => 'VWAP touch',\n      () => 'SMA ' + [50, 100, 150, 200][rnd(0, 3)],\n      () => 'Vol > ' + rnd(120, 220) + '%',\n      () => 'Struct break',\n      () => 'ATR stop ' + (rnd(12, 30) / 10).toFixed(1) + 'x'\n    ];\n    const mkName = () => {\n      const a = rnd(0, pool.length - 1);\n      let b = rnd(0, pool.length - 1);\n      while (b === a) b = rnd(0, pool.length - 1);\n      return pool[a]() + ' · ' + pool[b]();\n    };\n    let gen = 1, losers = [];\n    const rerunBtn = c.querySelector('[data-ev-rerun]');\n    const setStatus = (t, col) => { status.textContent = t; status.style.color = col; };\n    const generate = (fresh) => {\n      setStatus(fresh ? 'Generating variations…' : 'Breeding from the best…', fresh ? '#FBBF24' : '#34D399');\n      const idxs = fresh ? chips.map((_, i) => i) : losers;\n      idxs.forEach((i, k) => setTimeout(() => {\n        names[i].textContent = mkName();\n        names[i].style.textDecoration = 'none';\n        chips[i].style.opacity = '1';\n        chips[i].style.borderColor = 'rgba(52,211,153,.55)';\n        scores[i].textContent = '';\n        fills[i].style.width = '0%';\n        setTimeout(() => { chips[i].style.borderColor = 'rgba(255,255,255,.07)'; }, 500);\n      }, k * 120));\n      setTimeout(rank, idxs.length * 120 + 700);\n    };\n    const rank = () => {\n      setStatus('Backtesting & ranking…', '#A78BFA');\n      const base = Math.min(56 + gen * 6, 84);\n      const vals = chips.map(() => Math.min(rnd(base - 16, base + 10), 96));\n      losers = vals.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]).slice(4).map((o) => o[1]);\n      chips.forEach((ch, i) => setTimeout(() => {\n        scores[i].textContent = vals[i] + '%';\n        fills[i].style.width = Math.min(vals[i], 100) + '%';\n        const top = losers.indexOf(i) === -1;\n        scores[i].style.color = top ? '#A78BFA' : '#8A8A9E';\n        ch.style.borderColor = top ? 'rgba(124,92,255,.55)' : 'rgba(255,255,255,.07)';\n      }, 200 + i * 90));\n      setTimeout(discard, 200 + chips.length * 90 + 1000);\n    };\n    const discard = () => {\n      setStatus('Discarding the bottom 50%…', '#F87171');\n      losers.forEach((i, k) => setTimeout(() => {\n        chips[i].style.opacity = '0.15';\n        names[i].style.textDecoration = 'line-through';\n      }, k * 140));\n      setTimeout(() => {\n        if (gen >= 3) { finish(); return; }\n        gen++; genEl.textContent = gen; generate(false);\n      }, losers.length * 140 + 900);\n    };\n    const finish = () => {\n      setStatus('Evolution complete — presenting the winners', '#34D399');\n      const tops = [rnd(95, 98), rnd(92, 94), rnd(89, 91), rnd(85, 88)];\n      let k = 0;\n      chips.forEach((ch, i) => {\n        if (losers.indexOf(i) === -1) {\n          const v = tops[k++];\n          ch.style.borderColor = 'rgba(52,211,153,.55)';\n          scores[i].textContent = v + '%';\n          scores[i].style.color = '#34D399';\n          fills[i].style.width = v + '%';\n        }\n      });\n      if (rerunBtn) rerunBtn.style.display = 'inline-block';\n    };\n    const reset = () => {\n      if (rerunBtn) rerunBtn.style.display = 'none';\n      gen = 1; losers = [];\n      genEl.textContent = '1';\n      chips.forEach((ch, i) => {\n        ch.style.opacity = '0';\n        ch.style.borderColor = 'rgba(255,255,255,.07)';\n        names[i].style.textDecoration = 'none';\n        scores[i].textContent = '';\n        fills[i].style.width = '0%';\n      });\n      setTimeout(() => generate(true), 350);\n    };\n    if (rerunBtn && !rerunBtn._wired) { rerunBtn._wired = true; rerunBtn.addEventListener('click', reset); }\n    generate(true);\n  }\n  componentWillUnmount() {\n    document.removeEventListener('scroll', this._plx, { capture: true });\n    window.removeEventListener('resize', this._plx);\n    if (this._raf) cancelAnimationFrame(this._raf);\n  }\n  renderVals() {\n    const view = (this.state && this.state.view) || 'instrument';\n    const tf = (this.state && this.state.tf) || '1h';\n    const inst = view === 'instrument';\n    const tab = (on) => ({ flex: 1, borderRadius: 8, padding: 8, textAlign: 'center', cursor: 'pointer', background: on ? '#7C5CFF' : 'transparent' });\n    const tabText = (on) => ({ fontSize: 13, fontWeight: on ? 600 : 500, color: on ? '#fff' : '#8A8A9E' });\n    return {\n      menuOpen: !!(this.state && this.state.menuOpen),\n      toggleMenu: () => this.setState((s) => ({ menuOpen: !(s && s.menuOpen) })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      showTicker: this.props.showTicker ?? true,\n      isInstrument: inst,\n      isStrategy: !inst,\n      showInstrument: () => this.setState({ view: 'instrument' }),\n      showStrategy: () => this.setState({ view: 'strategy' }),\n      tabInstStyle: tab(inst),\n      tabInstText: tabText(inst),\n      tabStratStyle: tab(!inst),\n      tabStratText: tabText(!inst),\n      tfs: ['1m', '5m', '15m', '30m', '1h', '2h', '4h', '1d'].map((p) => ({\n        t: p,\n        pick: () => this.setState({ tf: p }),\n        style: {\n          fontFamily: \"'IBM Plex Mono',monospace\", fontSize: 12, padding: '6px 12px', borderRadius: 8, cursor: 'pointer',\n          fontWeight: p === tf ? 600 : 400,\n          color: p === tf ? '#fff' : '#8A8A9E',\n          background: p === tf ? '#7C5CFF' : '#1A1A26',\n          border: p === tf ? '1px solid #7C5CFF' : '1px solid rgba(255,255,255,.06)'\n        }\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
